<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ești offline — Invita</title>
    <style>
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: #F6F3EB; color: #211C27; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            text-align: center; padding: 24px;
        }
        .card { max-width: 360px; }
        h1 { font-family: Georgia, serif; font-size: 22px; margin: 16px 0 8px; }
        p { color: #6B6570; font-size: 14px; line-height: 1.6; }
        button {
            margin-top: 20px; padding: 10px 24px; border-radius: 999px; border: none;
            background: #7C2E3B; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Ești offline</h1>
        <p>Nu am detectat o conexiune la internet. Verifică rețeaua și încearcă din nou.</p>
        <button onclick="window.location.reload()">Reîncearcă</button>
    </div>
</body>
</html>
